# ========================================
# Docker Compose - Orchestrazione Container
# ========================================
#
# File di configurazione per avviare l'intera stack applicativa:
# - Frontend (Next.js) : porta 3000
# - Backend (FastAPI)  : porta 8000
#
# Comandi principali:
# - docker-compose up -d          : Avvia container in background
# - docker-compose down            : Ferma e rimuovi container
# - docker-compose logs -f         : Visualizza log in tempo reale
# - docker-compose build --no-cache : Ricostruisce immagini senza cache
#
# Versione 3.8: Supporta funzionalità moderne ed è compatibile con Docker Engine 19.03+
# ========================================

version: '3.8'


# ========================================
# SERVIZI (CONTAINER)
# ========================================
services:

  # ----------------------------------------
  # FRONTEND - Next.js Application
  # ----------------------------------------
  frontend:
    # Context di build per il Dockerfile
    build: ./frontend

    # Nome fisso container per facile identificazione
    container_name: autotriage-frontend

    # Mapping porte: Host → Container
    # Accessibile su: http://localhost:3000
    ports:
      - "3000:3000"

    # Variabili ambiente Runtime
    environment:
      # URL backend per chiamate API dal browser
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Modalità produzione (ottimizzazioni Next.js attive)
      - NODE_ENV=production

    # Dipendenza: Backend deve partire prima
    depends_on:
      - backend

    # Rete di comunicazione
    networks:
      - autotriage-network


  # ----------------------------------------
  # BACKEND - FastAPI Application
  # ----------------------------------------
  backend:
    # Context di build per il Dockerfile
    build: ./backend

    # Nome fisso container
    container_name: autotriage-backend

    # Mapping porte: Host → Container
    # API accessibile su: http://localhost:8000
    # Docs Swagger su: http://localhost:8000/api/v1/docs
    ports:
      - "8000:8000"

    # Variabili ambiente Runtime
    environment:
      # Percorso interno al container del modello ML (.pkl)
      - MODEL_PATH=/app/models/unified_model.pkl

      # Origini autorizzate per CORS (Cross-Origin Resource Sharing)
      # - http://localhost:3000: Accesso dal browser locale
      # - http://frontend:3000: Accesso interno container-to-container
      - ALLOWED_ORIGINS=["http://localhost:3000","http://frontend:3000"]

    # ----------------------------------------
    # VOLUMI (Host → Container)
    # ----------------------------------------
    # Montaggio directory read-only per sicurezza:
    # - Il container può LEGGERE ma non MODIFICARE i file
    # - Se un file manca, il container non parte
    volumes:
      # Modelli ML addestrati (.pkl)
      - ./models:/app/models:ro

      # Risorse statiche (template, documentazione)
      - ./assets:/app/assets:ro

      # Dataset di riferimento per training/testing
      - ./data:/app/data:ro

    # Rete di comunicazione
    networks:
      - autotriage-network

    # ----------------------------------------
    # HEALTH CHECK
    # ----------------------------------------
    # Monitoraggio stato di salute del container
    # Docker restarta automaticamente se unhealthy
    healthcheck:
      # Comando curl per testare endpoint health
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]

      # Intervallo tra controlli (30 secondi)
      interval: 30s

      # Timeout attesa risposta (10 secondi)
      timeout: 10s

      # Tentativi prima di segnare unhealthy (3 fallimenti = 90 secondi)
      retries: 3

      # Periodo di grazia all'avvio (non fallire subito)
      start_period: 40s


# ========================================
# RETI DI COMUNICAZIONE
# ========================================
networks:
  autotriage-network:
    # Driver Bridge: Rete privata interna
    # I container possono comunicarsi usando NOMI SERVIZI come hostname:
    # - Frontend chiama: http://backend:8000
    # - Backend chiama: http://frontend:3000
    driver: bridge
